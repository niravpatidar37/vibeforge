[project]
name = "vibeforge"
version = "0.1.0"
description = "VibeForge: an agentic playlist generator that forges ten tracks from a plain-language mood"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=1.2.6",
    "langsmith>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=8.1.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
vibeforge = "vibeforge.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeforge"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
